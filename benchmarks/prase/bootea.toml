# PRASE with BootEA (Sun et al., IJCAI 2018).
#
# One PRASE round runs PARIS, trains BootEA on the PARIS matches, and runs PARIS again
# with BootEA's proposed pairs and embedding similarity. [method] takes the settings of a
# run file's [method] table (src/prase/config.py); `options` are BootEA's settings.

[method]
name = "prase"
model = "bootea"

# Per-dataset BootEA options, merged over [method].options.
# On the 100K datasets, BootEA trains on batches of 20,000 triples and draws hard
# negatives from the nearest 2% of entities (epsilon 0.98) instead of the nearest 10%.
[dataset_options]
EN-FR-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
EN-DE-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
D-W-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
D-Y-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
