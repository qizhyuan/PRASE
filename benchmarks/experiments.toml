# These recipes train on PARIS matches and rank the entities PARIS leaves unaligned.
[experiments.se-mtranse]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
description = "MTransE Hits@1 on entities left unaligned by PARIS"
evaluation = "paris-seeded-ranking"
method = "prase-mtranse"

[experiments.se-iptranse]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
