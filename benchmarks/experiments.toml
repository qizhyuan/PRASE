# Benchmark recipes for PARIS, SE, PRASE, and supplemental evaluations.

# Each recipe defines a [method] table, as in a run file, or names the recipe whose method it reuses.
# dataset_options override the model options of an embedding method, and the method settings otherwise.
# A rounds table lists, per dataset, the additional PRASE round counts to run.
# The value @word_vectors stands for the FastText vector file passed with --word-vectors.

[experiments.paris]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
description = "PARIS alone"
[experiments.paris.method]
name = "paris"

[experiments.str-match]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
description = "STR-Match: normalized edit similarity of entity names, threshold 0.5"
[experiments.str-match.method]
name = "str-match"
threshold = 0.5
# Wikidata entities are identified by number; their names come from these attributes.
[experiments.str-match.dataset_options.D-W-15K-V2]
right_names = ["http://www.wikidata.org/entity/P1476", "http://www.wikidata.org/entity/P373", "http://www.wikidata.org/entity/P1559", "http://www.wikidata.org/entity/P1448"]
[experiments.str-match.dataset_options.D-W-100K-V2]
right_names = ["http://www.wikidata.org/entity/P1476", "http://www.wikidata.org/entity/P373", "http://www.wikidata.org/entity/P1559", "http://www.wikidata.org/entity/P1448"]

[experiments.emb-match]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
description = "EMB-Match: cosine similarity of averaged entity name vectors, threshold 0.5"
[experiments.emb-match.method]
name = "emb-match"
threshold = 0.5
word_vectors = "@word_vectors"
[experiments.emb-match.dataset_options.D-W-15K-V2]
right_names = ["http://www.wikidata.org/entity/P1476", "http://www.wikidata.org/entity/P373", "http://www.wikidata.org/entity/P1559", "http://www.wikidata.org/entity/P1448"]
[experiments.emb-match.dataset_options.D-W-100K-V2]
right_names = ["http://www.wikidata.org/entity/P1476", "http://www.wikidata.org/entity/P373", "http://www.wikidata.org/entity/P1559", "http://www.wikidata.org/entity/P1448"]
[experiments.emb-match.dataset_options.MED-BBK-9K]
left_names = ["英文名"]
right_names = ["英文名称", "中文名称"]

[experiments.prase-bootea]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
description = "PRASE with BootEA, both feedback channels"
[experiments.prase-bootea.method]
name = "prase"
model = "bootea"
[experiments.prase-bootea.dataset_options]
EN-FR-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
EN-DE-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
D-W-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
D-Y-100K-V2 = { batch_size = 20000, epsilon = 0.98 }
[experiments.prase-bootea.rounds]
D-W-15K-V2 = [2, 3, 4]
MED-BBK-9K = [2, 3, 4]

[experiments.prase-multike]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
description = "PRASE with MultiKE, both feedback channels"
[experiments.prase-multike.method]
name = "prase"
model = "multike"
[experiments.prase-multike.method.options]
word_vectors = "@word_vectors"
[experiments.prase-multike.dataset_options.D-W-100K-V2]
right_names = ["http://www.wikidata.org/entity/P373", "http://www.wikidata.org/entity/P1476"]
right_local_names = false
[experiments.prase-multike.dataset_options.D-Y-100K-V2]
left_names = ["skos:prefLabel", "http://dbpedia.org/ontology/birthName"]
right_names = ["skos:prefLabel", "http://dbpedia.org/ontology/birthName"]
[experiments.prase-multike.dataset_options.D-W-15K-V2]
right_names = ["http://www.wikidata.org/entity/P373", "http://www.wikidata.org/entity/P1476"]
right_local_names = false
[experiments.prase-multike.rounds]
D-W-15K-V2 = [2, 3, 4]
MED-BBK-9K = [2, 3, 4]

[experiments.prase-mtranse]
datasets = ["EN-FR-100K-V2", "EN-DE-100K-V2", "D-W-100K-V2", "D-Y-100K-V2", "D-W-15K-V2", "MED-BBK-9K"]
